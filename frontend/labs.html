<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Labs</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="assets/css/app.css" rel="stylesheet"></head>
<body data-page="labs"><div id="mainNav"></div><main class="container page-shell py-4"><div id="alerts"></div>
<div class="row g-3"><div class="col-lg-4"><div class="card"><div class="card-body"><h1 class="h5">Add Lab Result</h1><form id="labForm"><input class="form-control mb-2" name="patient_id" placeholder="Patient ID" required><input class="form-control mb-2" name="test_type" placeholder="Test type" required><textarea class="form-control mb-2" name="result" placeholder="Result" required></textarea><input class="form-control mb-3" name="file_url" placeholder="File URL"><button class="btn btn-primary">Save</button></form></div></div></div>
<div class="col-lg-8"><div class="card"><div class="card-body"><h2 class="h5">Results</h2><form id="labsSearchForm" class="row g-2 mb-3"><div class="col"><input class="form-control" name="patient_id" placeholder="Patient ID" required></div><div class="col-auto"><button class="btn btn-outline-primary">Load</button></div></form><table class="table table-striped"><thead><tr><th>ID</th><th>Test</th><th>Result</th><th>Date</th></tr></thead><tbody id="labsTable"></tbody></table></div></div></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/app.js"></script></body></html>
