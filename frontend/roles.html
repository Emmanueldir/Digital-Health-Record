<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Roles</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="assets/css/app.css" rel="stylesheet"></head>
<body data-page="roles"><div id="mainNav"></div><main class="container page-shell py-4"><div id="alerts"></div>
<div class="row g-3"><div class="col-lg-4"><div class="card mb-3"><div class="card-body"><h1 class="h5">Create Role</h1><form id="roleForm"><input class="form-control mb-2" name="name" placeholder="Role name" required><textarea class="form-control mb-3" name="description" placeholder="Description"></textarea><button class="btn btn-primary">Save</button></form></div></div><div class="card"><div class="card-body"><h2 class="h5">Assign Permission</h2><form id="rolePermissionForm"><input class="form-control mb-2" name="roleId" placeholder="Role ID" required><input class="form-control mb-3" name="permissionId" placeholder="Permission ID" required><button class="btn btn-outline-primary">Assign</button></form></div></div></div>
<div class="col-lg-8"><div class="card"><div class="card-body"><h2 class="h5">Roles</h2><table class="table table-striped"><thead><tr><th>ID</th><th>Name</th><th>Description</th><th></th></tr></thead><tbody id="rolesTable"></tbody></table></div></div></div></div>
<div class="modal fade" id="roleModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><form id="editRoleForm"><div class="modal-header"><h2 class="modal-title h5">Edit Role</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><input type="hidden" id="editRoleId" name="roleId"><label class="form-label">Name</label><input class="form-control mb-3" id="editRoleName" name="name" required><label class="form-label">Description</label><textarea class="form-control" id="editRoleDescription" name="description"></textarea></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save changes</button></div></form></div></div></div>
</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/app.js"></script></body></html>
