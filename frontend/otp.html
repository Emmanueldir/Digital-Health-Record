<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DHR OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/app.css" rel="stylesheet">
</head>
<body class="auth-page" data-page="otp">
    <main class="container py-5">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div id="alerts"></div>
                <section class="auth-panel">
                    <div class="auth-form">
                        <span class="badge text-bg-secondary mb-3">Staff MFA</span>
                        <h1 class="h3 fw-bold mb-3">Verify OTP</h1>
                        <p class="text-secondary mb-4">Enter the one-time code sent for this role session.</p>
                        <form id="otpForm">
                            <div class="mb-3">
                                <label class="form-label" for="email">Email</label>
                                <input class="form-control" id="email" type="email" name="email" autocomplete="email" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="otp">OTP</label>
                                <input class="form-control" id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" required>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Verify and enter</button>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
