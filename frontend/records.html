<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="records">
    <div id="mainNav"></div>
    <main class="container page-shell py-4">
        <div id="alerts"></div>
        <div class="row g-3">
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h1 class="h5">Create Record</h1>
                        <p class="section-subtitle">Document diagnosis, treatment, prescription, and care notes together.</p>
                        <form id="recordForm">
                            <div class="mb-3">
                                <label class="form-label" for="recordPatientId">Patient ID</label>
                                <input class="form-control" id="recordPatientId" name="patient_id" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="diagnosis">Diagnosis</label>
                                <textarea class="form-control" id="diagnosis" name="diagnosis" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="treatment">Treatment</label>
                                <textarea class="form-control" id="treatment" name="treatment"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="prescription">Prescription</label>
                                <textarea class="form-control" id="prescription" name="prescription"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="notes">Care notes</label>
                                <textarea class="form-control" id="notes" name="notes"></textarea>
                            </div>
                            <button class="btn btn-primary" type="submit">Save record</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex flex-column flex-md-row gap-3 justify-content-between mb-3">
                            <div>
                                <h2 class="h5 mb-1">Clinical Record Timeline</h2>
                                <p class="section-subtitle mb-0">Treatments, prescriptions, and care notes are shown inline for rapid review.</p>
                            </div>
                            <form id="recordSearchForm" class="d-flex gap-2" aria-label="Load patient records">
                                <input class="form-control" name="patient_id" placeholder="Patient ID" aria-label="Patient ID" required>
                                <button class="btn btn-outline-primary" type="submit">Load</button>
                            </form>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Clinical Summary</th>
                                        <th>Treatment</th>
                                        <th>Prescription</th>
                                        <th>Care Notes</th>
                                        <th>Updated</th>
                                    </tr>
                                </thead>
                                <tbody id="recordsTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
