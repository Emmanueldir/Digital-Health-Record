<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="patients">
    <div id="mainNav"></div>
    <main class="container page-shell py-4">
        <div id="alerts"></div>
        <div class="row g-3">
            <div class="col-xl-4">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-start justify-content-between gap-3 mb-3">
                            <div>
                                <h1 class="h5 mb-1">Register Patient</h1>
                                <p class="section-subtitle mb-0">Capture core identity, contact, and emergency details.</p>
                            </div>
                            <span class="badge text-bg-secondary">Intake</span>
                        </div>
                        <form id="patientForm">
                            <fieldset class="mb-4">
                                <legend class="form-label">Patient identity</legend>
                                <div class="mb-3">
                                    <label class="form-label" for="patient_code">Patient code</label>
                                    <div class="input-group">
                                        <input class="form-control" id="patient_code" name="patient_code" autocomplete="off" required>
                                        <button class="btn btn-outline-primary" id="generatePatientCode" type="button">Generate</button>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="full_name">Full name</label>
                                    <input class="form-control" id="full_name" name="full_name" autocomplete="name" required>
                                </div>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label" for="gender">Gender</label>
                                        <select class="form-select" id="gender" name="gender">
                                            <option value="">Not specified</option>
                                            <option>Male</option>
                                            <option>Female</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label" for="date_of_birth">Date of birth</label>
                                        <input class="form-control" id="date_of_birth" type="date" name="date_of_birth">
                                    </div>
                                </div>
                            </fieldset>
                            <fieldset class="mb-4">
                                <legend class="form-label">Contact and safety</legend>
                                <div class="mb-3">
                                    <label class="form-label" for="phone">Phone</label>
                                    <input class="form-control" id="phone" name="phone" autocomplete="tel">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="emergency_contact">Emergency contact</label>
                                    <input class="form-control" id="emergency_contact" name="emergency_contact" autocomplete="tel">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="address">Address</label>
                                    <textarea class="form-control" id="address" name="address" autocomplete="street-address"></textarea>
                                </div>
                            </fieldset>
                            <button class="btn btn-primary w-100" type="submit">Register patient</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-xl-8">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex flex-column flex-md-row gap-3 justify-content-between mb-3">
                            <div>
                                <h2 class="h5 mb-1">Patient Directory</h2>
                                <p class="section-subtitle mb-0">Search intake records and open verified patient profiles.</p>
                            </div>
                            <input class="form-control" id="patientSearch" type="search" placeholder="Search name, code, phone" aria-label="Search patients">
                        </div>
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Code</th>
                                        <th>Patient</th>
                                        <th>Contact</th>
                                        <th>Emergency</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="patientsTable"></tbody>
                            </table>
                        </div>
                        <nav class="mt-3" aria-label="Patient directory pagination">
                            <ul class="pagination mb-0">
                                <li class="page-item active"><span class="page-link">1</span></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
